name: Actions Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Actions execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "✅ GitHub Actions działa. Runtime może być uruchamiany z tego repo."
